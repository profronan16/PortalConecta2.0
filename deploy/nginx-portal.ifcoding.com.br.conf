# ==============================================================================
# Portal Conecta 2.0 — vhost do subdomínio portal.ifcoding.com.br
# VPS RackNerd (198.44.123.154) — nginx 1.20.1
#
# INSTALAÇÃO (na VPS, como root):
#   1. Copiar este arquivo para /etc/nginx/sites-available/portal.ifcoding.com.br
#   2. ln -s /etc/nginx/sites-available/portal.ifcoding.com.br \
#            /etc/nginx/sites-enabled/portal.ifcoding.com.br
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d portal.ifcoding.com.br \
#              --redirect --non-interactive --agree-tos -m SEU-EMAIL
#
# O vhost do FECIPE (ifcoding.com.br) NÃO é tocado por este arquivo: ele é um
# server block separado. O `server_name` explícito garante que o nginx escolha
# o bloco certo por SNI/Host, sem precisar mexer no vhost existente.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1) BLOCO HTTP
#    Serve o desafio ACME do certbot e redireciona o resto para HTTPS.
#    O `location /.well-known/acme-challenge/` fica FORA do redirect, senão o
#    certbot não consegue validar o domínio (erro clássico de redirect loop).
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name portal.ifcoding.com.br;

    # Desafio ACME (Let's Encrypt) — nunca redirecionar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2) BLOCO HTTPS
#    Estrutura pronta para 3 destinos possíveis — descomente SÓ UM:
#      (A) App Next.js rodando na própria VPS (node + systemd/pm2)  → porta 3000
#      (B) App na Vercel (proxy reverso)                            → ver (B)
#      (C) Só servir arquivos estáticos (PDF/imagens)               → ver (C)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.ifcoding.com.br;

    # --- Certificado (preenchido pelo certbot) ---------------------------------
    ssl_certificate     /etc/letsencrypt/live/portal.ifcoding.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.ifcoding.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Uploads: 10MB PDF / 5MB imagem ----------------------------------------
    # `client_max_body_size` é o teto absoluto do nginx. Precisa ser MAIOR que o
    # maior arquivo permitido (10MB) porque o corpo multipart/form-data carrega
    # boundary + cabeçalhos + outros campos do formulário além do arquivo.
    # Com 12M sobra folga confortável para o envelope. A validação fina por tipo
    # (10MB PDF / 5MB imagem) é feita na aplicação, que responde 413/400 com
    # mensagem clara — o nginx é só a última barreira.
    client_max_body_size 12M;
    client_body_timeout  120s;

    # Repassa o tamanho real do corpo para o Next.js (sem isso, requisições
    # grandes podem chegar truncadas ao upstream).
    client_body_buffer_size 512k;

    # --- Segurança -------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # --- Logs ------------------------------------------------------------------
    access_log /var/log/nginx/portal.ifcoding.com.br.access.log;
    error_log  /var/log/nginx/portal.ifcoding.com.br.error.log;

    # ==========================================================================
    # (C) ARQUIVOS ENVIADOS — armazenamento no próprio servidor
    #     Servidos direto pelo nginx (sem passar pelo Node): muito mais rápido e
    #     não consome processo da aplicação. Bloqueia execução de script e força
    #     download de PDF, evitando que um arquivo malicioso seja interpretado.
    # ==========================================================================
    location /files/ {
        alias /var/www/portal-files/;

        # Nunca executar nada que esteja aqui dentro
        location ~* \.(php|phtml|php[0-9]|cgi|pl|py|sh|js|mjs|html?|svg)$ {
            deny all;
        }

        # PDFs sempre como download/anexo (evita XSS via PDF no domínio)
        location ~* \.pdf$ {
            types { application/pdf pdf; }
            default_type application/pdf;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            expires 7d;
        }

        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            image/gif  gif;
        }
        default_type application/octet-stream;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
        autoindex off;

        # Se o arquivo não existir, 404 seco (não cai no proxy do Next)
        try_files $uri =404;
    }

    # ==========================================================================
    # (A) APP NEXT.JS NA PRÓPRIA VPS  — DESCOMENTE ESTE BLOCO SE FOR O CASO
    #     Upstream: next start na porta 3000 (systemd ou pm2).
    # ==========================================================================
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host  $host;
    #
    #     # WebSocket / HMR (necessário para streaming e Server Actions)
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_read_timeout    300s;
    #     proxy_connect_timeout  75s;
    #     proxy_send_timeout    300s;
    #
    #     # Uploads grandes direto para disco em vez de buffer em memória
    #     proxy_request_buffering off;
    # }

    # ==========================================================================
    # (B) APP NA VERCEL — proxy reverso (DESCOMENTE SE FOR O CASO)
    #     Observação: com o app na Vercel, o armazenamento de arquivos "no
    #     próprio servidor" NÃO pode ser feito por escrita direta no disco da
    #     VPS a partir do código serverless — é preciso um serviço de upload
    #     (ex.: portal-files-api na porta 3100) exposto aqui em /api/files/.
    # ==========================================================================
    # location /api/files/ {
    #     proxy_pass http://127.0.0.1:3100/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_request_buffering off;
    #     client_max_body_size 12M;
    # }
    #
    # location / {
    #     proxy_pass https://SEU-PROJETO.vercel.app;
    #     proxy_ssl_server_name on;
    #     proxy_set_header Host SEU-PROJETO.vercel.app;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 300s;
    # }
}
